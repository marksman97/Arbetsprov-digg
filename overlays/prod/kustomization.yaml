apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: arbetsprov-app
      spec:
        template:
          spec:
            containers:
            - name: arbetsprov-app
              image: arbetsprov.registry.se/arbetsprov-app:0.0.2
              env:
              - name: LOG_LEVEL
                value: INFO
